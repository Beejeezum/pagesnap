<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageSnap</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="logo">
        <img src="icons/icon48.png" alt="PageSnap" width="22" height="22">
        <h1>PageSnap</h1>
      </div>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>
          <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <!-- Tab Selector -->
    <div class="tabs">
      <button class="tab active" data-tab="capture">Capture</button>
      <button class="tab" data-tab="create">Create</button>
      <button class="tab" data-tab="library">Library</button>
    </div>

    <!-- Capture Tab -->
    <section class="tab-content active" id="captureTab">
      <div class="capture-modes">
        <button class="capture-btn primary" data-mode="fullpage">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="3" y="2" width="12" height="14" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
            <line x1="3" y1="6" x2="15" y2="6" stroke="currentColor" stroke-width="1.2"/>
            <line x1="3" y1="10" x2="15" y2="10" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.4"/>
          </svg>
          <div class="btn-text">
            <span class="btn-title">Full Page</span>
            <span class="btn-desc">Capture entire page</span>
          </div>
        </button>

        <button class="capture-btn" data-mode="visible">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="3" y="4" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
            <circle cx="9" cy="9" r="2" stroke="currentColor" stroke-width="1.3"/>
          </svg>
          <div class="btn-text">
            <span class="btn-title">Visible Area</span>
            <span class="btn-desc">Current viewport only</span>
          </div>
        </button>

        <button class="capture-btn" data-mode="zone">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M3 6V4a1 1 0 011-1h2M12 3h2a1 1 0 011 1v2M15 12v2a1 1 0 01-1 1h-2M6 15H4a1 1 0 01-1-1v-2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <div class="btn-text">
            <span class="btn-title">Zone Select</span>
            <span class="btn-desc">Draw a selection area</span>
          </div>
        </button>

        <button class="capture-btn" data-mode="content">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M3 4h12M3 7h8M3 10h10M3 13h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <div class="btn-text">
            <span class="btn-title">Capture Content</span>
            <span class="btn-desc">Extract text + images for AI</span>
          </div>
        </button>
      </div>
    </section>

    <!-- Create Tab (AI Output Modes) -->
    <section class="tab-content" id="createTab">
      <p class="tab-intro">Extract + generate in one click.</p>
      <div class="create-modes">
        <button class="create-btn" data-output="quickquote">
          <span class="create-icon">💬</span>
          <div class="btn-text">
            <span class="btn-title">Quick Quote</span>
            <span class="btn-desc">Punchy tweet / X post</span>
          </div>
        </button>

        <button class="create-btn" data-output="hottake">
          <span class="create-icon">🔥</span>
          <div class="btn-text">
            <span class="btn-title">Hot Take</span>
            <span class="btn-desc">Spicy contrarian angle</span>
          </div>
        </button>

        <button class="create-btn" data-output="linkedin">
          <span class="create-icon">💼</span>
          <div class="btn-text">
            <span class="btn-title">LinkedIn Post</span>
            <span class="btn-desc">Real thought leadership</span>
          </div>
        </button>

        <button class="create-btn" data-output="thread">
          <span class="create-icon">🧵</span>
          <div class="btn-text">
            <span class="btn-title">Thread Builder</span>
            <span class="btn-desc">Twitter/X thread</span>
          </div>
        </button>

        <button class="create-btn" data-output="summary">
          <span class="create-icon">📋</span>
          <div class="btn-text">
            <span class="btn-title">Summary</span>
            <span class="btn-desc">Key points at a glance</span>
          </div>
        </button>

        <button class="create-btn" data-output="tldr">
          <span class="create-icon">⚡</span>
          <div class="btn-text">
            <span class="btn-title">TL;DR</span>
            <span class="btn-desc">2-3 sentences, max</span>
          </div>
        </button>

        <button class="create-btn" data-output="bulletbrief">
          <span class="create-icon">📌</span>
          <div class="btn-text">
            <span class="btn-title">Bullet Brief</span>
            <span class="btn-desc">Just the facts</span>
          </div>
        </button>

        <button class="create-btn" data-output="newsletter">
          <span class="create-icon">📧</span>
          <div class="btn-text">
            <span class="btn-title">Newsletter</span>
            <span class="btn-desc">Editorial blurb</span>
          </div>
        </button>

        <button class="create-btn" data-output="blogseed">
          <span class="create-icon">📝</span>
          <div class="btn-text">
            <span class="btn-title">Blog Seed</span>
            <span class="btn-desc">Blog ideas + outline</span>
          </div>
        </button>

        <button class="create-btn" data-output="rewrite">
          <span class="create-icon">🔄</span>
          <div class="btn-text">
            <span class="btn-title">Rewrite</span>
            <span class="btn-desc">Remix in new voice</span>
          </div>
        </button>

        <button class="create-btn" data-output="llmextract">
          <span class="create-icon">🤖</span>
          <div class="btn-text">
            <span class="btn-title">LLM Extract</span>
            <span class="btn-desc">Clean markdown for AI</span>
          </div>
        </button>

        <button class="create-btn" data-output="graphic">
          <span class="create-icon">🎨</span>
          <div class="btn-text">
            <span class="btn-title">Social Graphic</span>
            <span class="btn-desc">Shareable quote card</span>
          </div>
        </button>
      </div>
    </section>

    <!-- Library Tab (Swipe File) -->
    <section class="tab-content" id="libraryTab">
      <div class="library-header">
        <input type="text" class="search-input" id="librarySearch" placeholder="Search your library...">
      </div>
      <div class="library-filters" id="libraryFilters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="favorites">Favorites</button>
      </div>
      <div class="library-list" id="libraryList">
        <div class="empty-state">
          <p>No captures yet.</p>
          <p class="muted">Captured content will appear here.</p>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span class="shortcut-hint">Alt+Shift+S quick capture</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
